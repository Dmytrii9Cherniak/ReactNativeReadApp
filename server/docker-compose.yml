# Локальне оточення для розробки: PostgreSQL + Mailpit (перехоплює листи, UI на http://localhost:8025)
name: reader

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: reader
      POSTGRES_DB: reader
    # 5433 зовні: 5432 на Windows часто зайнятий локально встановленим PostgreSQL
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reader']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
